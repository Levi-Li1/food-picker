<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 足球赛况</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #007aff;
            --green: #30d158; --red: #ff453a; --orange: #ff9f0a;
            --text: #ffffff; --text2: rgba(255,255,255,0.75); --text3: rgba(255,255,255,0.50);
            --glass: rgba(255,255,255,0.12); --glass-hover: rgba(255,255,255,0.18);
            --glass-border: rgba(255,255,255,0.15); --glass-active: rgba(255,255,255,0.25);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif;
            background: linear-gradient(180deg, #0a1628 0%, #162447 30%, #1a1a2e 60%, #0f3460 100%);
            min-height: 100vh; color: var(--text);
            -webkit-font-smoothing: antialiased; position: relative; overflow-x: hidden;
            transition: background 0.6s ease;
        }
        body.spfl-mode {
            background: linear-gradient(180deg, #3b0a0a 0%, #5c1010 30%, #4a0000 60%, #7a1515 100%);
        }
        body::before {
            content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at 20% 20%, rgba(0,122,255,0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 60%, rgba(48,209,88,0.10) 0%, transparent 50%),
                        radial-gradient(ellipse at 40% 80%, rgba(255,159,10,0.08) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
            transition: background 0.6s ease;
        }
        body.spfl-mode::before {
            background: radial-gradient(ellipse at 20% 15%, rgba(255,40,30,0.38) 0%, transparent 50%),
                        radial-gradient(ellipse at 75% 70%, rgba(255,30,20,0.28) 0%, transparent 50%),
                        radial-gradient(ellipse at 40% 80%, rgba(255,160,20,0.18) 0%, transparent 50%);
        }
        /* 赛事氛围装饰 - 球场灯光效果 */
        body.spfl-mode::after {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.06) 0%, transparent 60%),
                radial-gradient(circle at 12% 50%, rgba(255,50,35,0.15) 0%, transparent 50%),
                radial-gradient(circle at 88% 55%, rgba(255,40,30,0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(255,120,30,0.08) 0%, transparent 35%);
            pointer-events: none; z-index: 0;
            animation: fieldGlow 4s ease-in-out infinite alternate;
        }
        @keyframes fieldGlow {
            0% { opacity: 0.65; }
            100% { opacity: 1; }
        }
        .content { position: relative; z-index: 1; }
        /* 世界杯海报风格头部 */
        .header {
            text-align: center; padding: 60px 20px 30px;
            position: relative;
        }
        .header::before {
            content: '2026';
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            font-size: 120px; font-weight: 900; letter-spacing: 8px;
            color: rgba(255,255,255,0.03);
            pointer-events: none; z-index: -1;
            line-height: 1;
        }
        .header .trophy-icon { margin-bottom: 8px; opacity: 0.8; }
        .header h1 {
            font-size: 34px; font-weight: 700; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a0c4ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            position: relative;
        }
        .header .sub {
            font-size: 13px; color: var(--text3); margin-top: 6px; letter-spacing: 2px;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .header .sub::before, .header .sub::after {
            content: ''; width: 40px; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }
        /* 折叠面板 */
        .date-group { margin-bottom: 12px; }
        .date-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; border-radius: 10px;
            background: rgba(255,255,255,0.08);
            cursor: pointer; font-size: 13px; font-weight: 600;
            color: var(--text2); user-select: none;
            transition: background 0.2s;
        }
        .date-header:hover { background: rgba(255,255,255,0.12); }
        .date-header .arrow {
            transition: transform 0.3s;
            width: 14px; height: 14px;
        }
        .date-header .arrow.open { transform: rotate(180deg); }
        .date-body { overflow: hidden; max-height: 0; transition: max-height 0.4s ease; }
        .date-body.open { max-height: 2000px; }
        .date-body .match-card { margin-top: 8px; }

        .section-tabs {
            display: flex; gap: 0; margin: 0 20px 16px;
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 14px; padding: 3px; border: 1px solid var(--glass-border);
        }
        .section-tab {
            flex: 1; padding: 11px 16px; text-align: center; font-size: 14px; font-weight: 600;
            border: none; border-radius: 11px; cursor: pointer; background: transparent;
            color: var(--text3); font-family: inherit; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .section-tab.active {
            background: var(--glass-active); color: #fff;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .tab-icon { width: 18px; height: 18px; }

        .card {
            background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 20px; margin: 12px 16px; padding: 22px 20px;
            border: 1px solid var(--glass-border); box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        .card h2 {
            font-size: 18px; font-weight: 600; margin-bottom: 16px;
            color: var(--text2); letter-spacing: -0.2px;
            display: flex; align-items: center; gap: 8px;
        }
        .card h2 .heading-icon { width: 20px; height: 20px; }

        .match-card {
            background: rgba(255,255,255,0.06); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 14px; padding: 16px 18px; margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.08); transition: all 0.2s;
        }
        .match-card:hover { background: rgba(255,255,255,0.10); }
        .match-header {
            display: flex; justify-content: space-between; font-size: 12px;
            color: var(--text3); margin-bottom: 12px; letter-spacing: 0.3px;
        }
        .match-status {
            font-weight: 600; font-size: 10px; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.5px;
        }
        .match-status.live { background: var(--red); color: #fff; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
        .match-status.final { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.7); }
        .match-status.upcoming { background: rgba(255,255,255,0.2); color: #fff; }

        .match-teams {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
        }
        .match-team {
            display: flex; align-items: center; gap: 8px;
            font-size: 16px; font-weight: 600; letter-spacing: -0.2px;
            min-width: 0;
        }
        .match-team.home { justify-content: flex-start; }
        .match-team.away { justify-content: flex-end; flex-direction: row-reverse; }
        .match-team .flag { display: inline-flex; align-items: center; flex-shrink: 0; }
        .match-team .flag img { display: block; }
        .match-name {
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .match-score {
            font-size: 28px; font-weight: 700;
            text-align: center; letter-spacing: 4px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            min-width: 80px;
        }
        .match-score.vs { font-size: 14px; color: var(--text3); letter-spacing: 2px; font-weight: 500; }
        .match-scorers { font-size: 11px; color: var(--text3); margin-top: 8px; letter-spacing: 0.3px; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            text-align: left; padding: 10px 4px 8px; font-size: 10px; color: var(--text3);
            text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.08); font-weight: 500;
        }
        th:first-child { width: 30px; }
        th:nth-child(2) { min-width: 100px; }
        th:last-child, td:last-child { text-align: right; }
        td { padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        tr:last-child td { border-bottom: none; }

        .pos {
            width: 22px; height: 22px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700;
        }
        .pos.c1 { background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; }
        .pos.c2 { background: linear-gradient(135deg, #C0C0C0, #A8A8A8); color: #000; }
        .pos.c3 { background: linear-gradient(135deg, #CD7F32, #B8860B); color: #fff; }
        .pos.cl { background: rgba(255,69,58,0.5); color: #fff; font-size: 10px; }
        .team-name { font-weight: 500; font-size: 13px; }
        .team-name .flag { font-size: 16px; margin-right: 4px; vertical-align: -1px; }
        .crest { width: 28px; height: 28px; display: inline-block; vertical-align: middle; }
        .crest svg { width: 28px; height: 28px; border-radius: 50%; display: block; }
        th:nth-child(2) { width: 36px; }
        .stats { font-size: 11px; color: var(--text3); font-variant-numeric: tabular-nums; }
        .pts { font-weight: 700; font-size: 14px; color: #fff; }
        .gd { font-weight: 500; }
        .gd.positive { color: var(--green); }
        .gd.negative { color: var(--red); }

        .group-selector { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
        .group-btn {
            width: 34px; height: 34px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
            color: var(--text3); transition: all 0.25s;
        }
        .group-btn:hover { background: rgba(255,255,255,0.12); }
        .group-btn.active {
            background: rgba(0,122,255,0.3); border-color: rgba(0,122,255,0.4);
            color: #fff; box-shadow: 0 0 12px rgba(0,122,255,0.2);
        }

        .loading { text-align: center; padding: 36px; color: var(--text3); }
        .bottom-spacer { height: 40px; }
        .note { font-size: 11px; color: var(--text3); margin-top: 16px; text-align: center; letter-spacing: 0.5px; }

        .leader-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: linear-gradient(135deg, rgba(255,215,0,0.2), rgba(255,165,0,0.15));
            border: 1px solid rgba(255,215,0,0.25);
            border-radius: 20px; padding: 6px 14px;
            font-size: 12px; font-weight: 600; color: #FFD700; margin-bottom: 16px;
        }
        .summary-row {
            display: flex; justify-content: space-between; padding: 6px 0;
            font-size: 13px;
        }
        .summary-row .label { color: var(--text3); }
        .summary-row .value { font-weight: 600; }

        @media (max-width: 380px) {
            th:nth-child(4),td:nth-child(4),
            th:nth-child(5),td:nth-child(5),
            th:nth-child(6),td:nth-child(6) { display: none; }
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="header">
            <div class="trophy-icon">
                <svg width="44" height="44" viewBox="0 0 64 64" fill="none">
                    <defs>
                        <radialGradient id="bg" cx="50%" cy="40%" r="50%">
                            <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
                            <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
                        </radialGradient>
                    </defs>
                    <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
                    <!-- 五边形 -->
                    <polygon points="32,10 40,16 37,26 27,26 24,16" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.3" stroke-linejoin="round"/>
                    <polygon points="32,54 24,48 27,38 37,38 40,48" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.3" stroke-linejoin="round"/>
                    <polygon points="10,30 16,22 26,25 26,35 16,38" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.3" stroke-linejoin="round"/>
                    <polygon points="54,30 48,22 38,25 38,35 48,38" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.3" stroke-linejoin="round"/>
                    <!-- 连接线 -->
                    <line x1="32" y1="10" x2="32" y2="22" stroke="rgba(255,255,255,0.5)" stroke-width="1.3"/>
                    <line x1="24" y1="16" x2="16" y2="22" stroke="rgba(255,255,255,0.5)" stroke-width="1.3"/>
                    <line x1="40" y1="16" x2="48" y2="22" stroke="rgba(255,255,255,0.5)" stroke-width="1.3"/>
                    <line x1="27" y1="26" x2="10" y2="30" stroke="rgba(255,255,255,0.5)" stroke-width="1.3"/>
                    <line x1="37" y1="26" x2="54" y2="30" stroke="rgba(255,255,255,0.5)" stroke-width="1.3"/>
                    <line x1="16" y1="38" x2="24" y2="48" stroke="rgba(255,255,255,0.5)" stroke-width="1.3"/>
                    <line x1="48" y1="38" x2="40" y2="48" stroke="rgba(255,255,255,0.5)" stroke-width="1.3"/>
                </svg>
            </div>
            <h1>2026 足球赛况</h1>
            <p class="sub">FIFA WORLD CUP · 江苏省城市足球联赛</p>
        </div>

        <div class="section-tabs">
            <button class="section-tab active" onclick="showSection('worldcup')">
                <!-- globe icon -->
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                世界杯 2026
            </button>
            <button class="section-tab" onclick="showSection('spfl')">
                <!-- trophy icon -->
                <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5C7 4 7 7 8 9"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5C17 4 17 7 16 9"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
                苏超 2026
            </button>
        </div>

        <div id="worldcup-section">
            <div class="card" id="wc-recent">
                <h2>
                    <svg class="heading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    最新赛果
                </h2>
                <div class="loading">加载中...</div>
            </div>
            <div class="card" id="wc-today">
                <h2>
                    <svg class="heading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    赛程预告
                </h2>
                <div class="loading">加载中...</div>
            </div>
            <div class="card">
                <h2>
                    <svg class="heading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    小组积分
                </h2>
                <div class="group-selector" id="groupBtns"></div>
                <div id="groupTable"></div>
            </div>
        </div>

        <div id="spfl-section" style="display:none;">
            <div class="card">
                <h2>
                    <svg class="heading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                    积分榜
                </h2>
                <table id="spflTable"></table>
                <p class="note">数据来源 jscl.moyu.js.cn · 实时更新</p>
            </div>
            <div class="card" id="spfl-upcoming">
                <h2>
                    <svg class="heading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    赛程预告 · 第 9 轮
                </h2>
                <div id="spflFixtures"></div>
            </div>
            <div class="card">
                <h2>
                    <svg class="heading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                    联赛速览
                </h2>
                <div class="match-card" style="margin-bottom:0;">
                    <div style="display:flex;flex-direction:column;gap:14px;">
                        <div class="summary-row"><span class="label">参赛队伍</span><span class="value">13 支城市代表队</span></div>
                        <div class="summary-row"><span class="label">赛制</span><span class="value">常规赛 + 淘汰赛</span></div>
                        <div class="summary-row"><span class="label">领头羊</span><span class="value" style="color:#FFD700;">盐城队 · 15分</span></div>
                        <div class="summary-row"><span class="label">已进行</span><span class="value">4–5 轮</span></div>
                        <div class="summary-row"><span class="label">阶段</span><span class="value">常规赛进行中</span></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="bottom-spacer"></div>
    </div>

    <script>
        const API = 'https://worldcup26.ir';

        const ZH = {
            1:'墨西哥',2:'南非',3:'韩国',4:'捷克',5:'加拿大',6:'波黑',7:'卡塔尔',8:'瑞士',
            9:'巴西',10:'摩洛哥',11:'海地',12:'苏格兰',13:'美国',14:'巴拉圭',15:'澳大利亚',16:'土耳其',
            17:'德国',18:'库拉索',19:'科特迪瓦',20:'厄瓜多尔',21:'荷兰',22:'日本',23:'瑞典',24:'突尼斯',
            25:'比利时',26:'埃及',27:'伊朗',28:'新西兰',29:'西班牙',30:'佛得角',31:'沙特',32:'乌拉圭',
            33:'法国',34:'塞内加尔',35:'伊拉克',36:'挪威',37:'阿根廷',38:'阿尔及利亚',39:'奥地利',40:'约旦',
            41:'葡萄牙',42:'民主刚果',43:'乌兹别克斯坦',44:'哥伦比亚',45:'英格兰',46:'克罗地亚',47:'加纳',48:'巴拿马'
        };

        const FLAGS = {
            1:'mx',2:'za',3:'kr',4:'cz',5:'ca',6:'ba',7:'qa',8:'ch',
            9:'br',10:'ma',11:'ht',12:'gb-sct',13:'us',14:'py',15:'au',16:'tr',
            17:'de',18:'cw',19:'ci',20:'ec',21:'nl',22:'jp',23:'se',24:'tn',
            25:'be',26:'eg',27:'ir',28:'nz',29:'es',30:'cv',31:'sa',32:'uy',
            33:'fr',34:'sn',35:'iq',36:'no',37:'ar',38:'dz',39:'at',40:'jo',
            41:'pt',42:'cd',43:'uz',44:'co',45:'gb-eng',46:'hr',47:'gh',48:'pa'
        };
        function flagImg(cc) {
            return cc ? `<img src="https://flagcdn.com/28x21/${cc}.png" width="22" height="16" style="border-radius:2px;vertical-align:-2px;display:inline-block" alt="" loading="lazy">` : '';
        }

        async function loadWorldCup() {
            try {
                const [gamesRes, teamsRes, groupsRes, stadiumsRes] = await Promise.all([
                    fetch(`${API}/get/games`), fetch(`${API}/get/teams`), fetch(`${API}/get/groups`), fetch(`${API}/get/stadiums`)
                ]);
                const gd = await gamesRes.json(), td = await teamsRes.json(), grd = await groupsRes.json(), sd = await stadiumsRes.json();
                const teams = {};
                (td.teams||td).forEach(t => { const id=t.id||t._id; teams[id]=ZH[id]||t.name_en||t.name; });
                const stadiums = {};
                (sd.stadiums||sd).forEach(s => { stadiums[s.id||s._id] = s.name_en||s.name; });
                const games = gd.games||gd||[];
                renderWorldCupMatches(games, teams, stadiums);
                renderGroupStandings(grd, teams, games);
            } catch(e) {
                document.querySelectorAll('#wc-recent .loading, #wc-today .loading').forEach(el =>
                    el.textContent='数据加载失败，请稍后再试');
            }
        }

        function renderWorldCupMatches(games, teams, stadiums) {
            const finished = games.filter(g => g.finished==='TRUE'||g.time_elapsed==='finished');

            // 合并今日+未来3天 → 赛程预告
            const now = new Date();
            const dateSet = new Set();
            for (let i=0; i<=3; i++) {
                const d = new Date(now);
                d.setDate(d.getDate()+i);
                dateSet.add(d.toISOString().split('T')[0]);
            }
            const upcoming = games.filter(g => {
                if(g.finished==='TRUE'||g.finished==='TRUE'||g.time_elapsed==='finished') return false;
                const gd=g.local_date?g.local_date.split(' ')[0]:'';
                if(!gd) return false;
                const [m,d,y]=gd.split('/');
                return dateSet.has(`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`);
            });

            const rd=document.getElementById('wc-recent');
            rd.innerHTML = finished.length
                ? '<h2><svg class="heading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>最新赛果</h2>'+finished.map(g=>matchHTML(g,teams,'final',stadiums)).join('')
                : '<h2><svg class="heading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>最新赛果</h2><p style="color:var(--text3);text-align:center;padding:10px;">暂无已结束的比赛</p>';

            // 赛程预告按日期折叠
            const running=games.filter(g=>g.time_elapsed==='live');
            const all=[...running,...upcoming];
            const grouped = {};
            all.forEach(g => {
                const gd = g.local_date ? g.local_date.split(' ')[0] : '未知';
                if(!grouped[gd]) grouped[gd] = [];
                grouped[gd].push(g);
            });
            const todayDiv = document.getElementById('wc-today');
            if (all.length === 0) {
                todayDiv.innerHTML = '<h2><svg class="heading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>赛程预告</h2><p style="color:var(--text3);text-align:center;padding:10px;">暂无预告数据</p>';
            } else {
                let html = '<h2><svg class="heading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>赛程预告</h2>';
                const dates = Object.keys(grouped).sort();
                dates.forEach((date, idx) => {
                    const ms = grouped[date];
                    const f = idx === 0; // 第一个（最近）默认展开
                    html += `<div class="date-group">
                        <div class="date-header" onclick="toggleDate(this)">
                            <span>📅 ${date} · ${ms.length} 场比赛</span>
                            <svg class="arrow${f?' open':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                        </div>
                        <div class="date-body${f?' open':''}">
                            ${ms.map(g => matchHTML(g, teams, g.time_elapsed==='live'?'live':'upcoming', stadiums)).join('')}
                        </div>
                    </div>`;
                });
                todayDiv.innerHTML = html;
            }
        }

        function toggleDate(el) {
            const body = el.nextElementSibling;
            const arrow = el.querySelector('.arrow');
            body.classList.toggle('open');
            arrow.classList.toggle('open');
        }

        // 球场时区偏移 (UTC) → 北京时间 +8
        const TZ = {1:-6,2:-6,3:-6,4:-5,5:-5,6:-5,7:-4,8:-4,9:-4,10:-4,11:-4,12:-4,13:-7,14:-7,15:-7,16:-7};
        function toBeijing(dateStr, stadiumId) {
            if(!dateStr) return '';
            const [d,t] = dateStr.split(' ');
            const [m,dy,y] = d.split('/');
            const [h,mi] = (t||'00:00').split(':');
            const utc = new Date(Date.UTC(+y, +m-1, +dy, +h, +mi));
            utc.setHours(utc.getHours() - (TZ[stadiumId]||0));
            const bj = new Date(utc.getTime() + 8*3600000);
            return `${bj.getMonth()+1}/${bj.getDate()} ${String(bj.getHours()).padStart(2,'0')}:${String(bj.getMinutes()).padStart(2,'0')}`;
        }

        function matchHTML(g, teams, status, stadiums) {
            const hid = g.home_team_id, aid = g.away_team_id;
            const home = teams[hid]||g.home_team_name_en||'?';
            const away = teams[aid]||g.away_team_name_en||'?';
            const hflag = flagImg(FLAGS[hid]), aflag = flagImg(FLAGS[aid]);
            const bjTime = toBeijing(g.local_date, g.stadium_id);
            const labels = { live:'<span style="display:inline-flex;align-items:center;gap:4px;"><svg width="7" height="7" viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="#ff453a"/></svg>进行中</span>', final:'已结束', upcoming:'即将开始' };
            const venue = stadiums?.[g.stadium_id]||'';

            const clean = (v) => {
                if(!v || v==='null' || v==='undefined') return '';
                // 处理 JSON 数组: ["a","b"]
                try {
                    const p = JSON.parse(v);
                    if(Array.isArray(p)) return p.filter(x=>x).join(', ');
                    if(typeof p === 'string') return p;
                    return '';
                } catch(e) {}
                // 处理 PostgreSQL 风格: {"a","b"}
                if(v.startsWith('{') && v.endsWith('}')) {
                    return v.slice(1,-1).split(',').map(s=>s.replace(/^"|"$/g,'').trim()).filter(x=>x).join(', ');
                }
                return String(v);
            };
            let scorers='';
            if(status==='final'){
                const hs = clean(g.home_scorers), as = clean(g.away_scorers);
                if(hs || as) scorers = `<div class="match-scorers"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-linejoin="round" style="vertical-align:-2px"><circle cx="12" cy="12" r="10"/><polygon points="12,5 14,9 18,10 15,13 16,18 12,15 8,18 9,13 6,10 10,9"/></svg> ${hs}${hs&&as?'  ·  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-linejoin="round" style="vertical-align:-2px"><circle cx="12" cy="12" r="10"/><polygon points="12,5 14,9 18,10 15,13 16,18 12,15 8,18 9,13 6,10 10,9"/></svg> ':''}${as}</div>`;
            }

            return `<div class="match-card">
                <div class="match-header"><span>${g.group||''}组 · ${bjTime}（北京时间）</span><span class="match-status ${status}">${labels[status]}</span></div>
                <div class="match-teams">
                    <div class="match-team home"><span class="flag">${hflag}</span><span class="match-name">${home}</span></div>
                    <div class="match-score ${status==='upcoming'?'vs':''}">${status==='upcoming'?'VS':`${g.home_score||0} – ${g.away_score||0}`}</div>
                    <div class="match-team away"><span class="flag">${aflag}</span><span class="match-name">${away}</span></div>
                </div>${scorers}${venue?`<div style="font-size:11px;color:var(--text3);margin-top:8px;display:flex;align-items:center;gap:4px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${venue}</div>`:''}</div>`;
        }

        let currentGroup='A', allGroups=[], teamMap={};

        function renderGroupStandings(groupsData, teams, games) {
            teamMap=teams;
            allGroups=(groupsData.groups||groupsData).filter(g=>g.name||g.group);

            // 默认展开最新比赛所在小组
            const active = games.filter(g => g.time_elapsed==='live' || g.finished==='TRUE');
            if(active.length) {
                const latest = active.sort((a,b) => {
                    const da = a.local_date||'', db = b.local_date||'';
                    return db.localeCompare(da);
                })[0];
                if(latest.group) currentGroup = latest.group;
            }

            document.getElementById('groupBtns').innerHTML='ABCDEFGHIJKL'.split('').map(l=>
                `<button class="group-btn${l===currentGroup?' active':''}" onclick="showGroup('${l}')">${l}</button>`
            ).join('');
            showGroup(currentGroup);
        }

        function showGroup(letter) {
            currentGroup=letter;
            document.querySelectorAll('.group-btn').forEach(b=>b.classList.remove('active'));
            const btn = document.querySelector(`.group-btn[onclick*="'${letter}'"]`);
            if(btn) btn.classList.add('active');
            const g=allGroups.find(g=>(g.name||g.group)===letter);
            if(!g){document.getElementById('groupTable').innerHTML='<p style="color:var(--text3);text-align:center;">暂无数据</p>';return;}
            const list=(g.teams||g.standings||[]).sort((a,b)=>{
                const pa=(a.wins||a.won||a.w||0)*3+(a.draws||a.drawn||a.d||0);
                const pb=(b.wins||b.won||b.w||0)*3+(b.draws||b.drawn||b.d||0);
                if(pb!==pa)return pb-pa;
                return((b.gf||b.goals_for||0)-(b.ga||b.goals_against||0))-((a.gf||a.goals_for||0)-(a.ga||a.goals_against||0));
            });
            document.getElementById('groupTable').innerHTML=`<table>
                <tr><th></th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>进球</th><th>净胜</th><th>分</th></tr>
                ${list.map((t,i)=>{
                    const tid=t.team_id||t.id;
                    const n=ZH[tid]||teamMap[tid]||`Team ${tid}`;
                    const fl=flagImg(FLAGS[tid]);
                    const mp=t.played||t.mp||t.p||0,w=t.wins||t.won||t.w||0,d=t.draws||t.drawn||t.d||0,l=t.losses||t.lost||t.l||0;
                    const gf=t.gf||t.goals_for||0,ga=t.ga||t.goals_against||0,gd=gf-ga,pts=w*3+d;
                    return `<tr><td>${i+1}</td><td class="team-name"><span class="flag">${fl}</span>${n}</td><td class="stats">${mp}</td><td class="stats">${w}</td><td class="stats">${d}</td><td class="stats">${l}</td><td class="stats">${gf}-${ga}</td><td class="stats gd ${gd>0?'positive':gd<0?'negative':''}">${gd>0?'+':''}${gd}</td><td class="pts">${pts}</td></tr>`;
                }).join('')}
            </table>`;
        }

        // === 江苏省城市足球联赛（苏超）===
        // 每队队徽：SVG圆形徽章 + 城市特色元素
        const SPFL = [
            { pos:1, name:'盐城队', p:5, w:5, d:0, l:0, gf:7, ga:1, gd:6, pts:15,
              crest:'https://imgcdn.yzwb.net/@/catchimages/20260317/1773731690066016533.jpg?imageMogr2/thumbnail/100x>/strip/ignore-error/1|imageslim' },
            { pos:2, name:'无锡队', p:4, w:2, d:2, l:0, gf:6, ga:2, gd:4, pts:8,
              crest:'https://imgcdn.yzwb.net/@/catchimages/20260317/1773731687099088565.jpg?imageMogr2/thumbnail/100x>/strip/ignore-error/1|imageslim' },
            { pos:3, name:'徐州队', p:4, w:2, d:1, l:1, gf:6, ga:3, gd:3, pts:7,
              crest:'https://imgcdn.yzwb.net/@/catchimages/20260317/1773731687482071394.jpg?imageMogr2/thumbnail/100x>/strip/ignore-error/1|imageslim' },
            { pos:4, name:'苏州队', p:4, w:2, d:1, l:1, gf:5, ga:4, gd:1, pts:7,
              crest:'https://imgcdn.yzwb.net/@/catchimages/20260317/1773731688259091649.jpg?imageMogr2/thumbnail/100x>/strip/ignore-error/1|imageslim' },
            { pos:5, name:'淮安队', p:4, w:2, d:1, l:1, gf:4, ga:3, gd:1, pts:7,
              crest:'https://imgcdn.yzwb.net/@/catchimages/20260317/1773731689730099097.jpg?imageMogr2/thumbnail/100x>/strip/ignore-error/1|imageslim' },
            { pos:6, name:'常州队', p:4, w:2, d:0, l:2, gf:7, ga:4, gd:3, pts:6,
              crest:'https://imgcdn.yzwb.net/@/catchimages/20260317/1773731687910005131.jpg?imageMogr2/thumbnail/100x>/strip/ignore-error/1|imageslim' },
            { pos:7, name:'宿迁队', p:4, w:2, d:0, l:2, gf:5, ga:4, gd:1, pts:6,
              crest:'https://imgcdn.yzwb.net/@/catchimages/20260317/1773731691618007787.jpg?imageMogr2/thumbnail/100x>/strip/ignore-error/1|imageslim' },
            { pos:8, name:'南京队', p:4, w:1, d:2, l:1, gf:2, ga:3, gd:-1, pts:5,
              crest:'https://imgcdn.yzwb.net/@/catchimages/20260317/1773731686598010011.png?imageMogr2/thumbnail/100x>/strip/ignore-error/1|imageslim' },
            { pos:9, name:'南通队', p:4, w:1, d:2, l:1, gf:2, ga:4, gd:-2, pts:5,
              crest:'https://imgcdn.yzwb.net/@/catchimages/20260317/1773731688702073016.jpg?imageMogr2/thumbnail/100x>/strip/ignore-error/1|imageslim' },
            { pos:10, name:'扬州队', p:5, w:1, d:1, l:3, gf:3, ga:6, gd:-3, pts:4,
              crest:'https://imgcdn.yzwb.net/@/catchimages/20260317/1773731690475038336.jpg?imageMogr2/thumbnail/100x>/strip/ignore-error/1|imageslim' },
            { pos:11, name:'泰州队', p:4, w:1, d:0, l:3, gf:5, ga:9, gd:-4, pts:3,
              crest:'https://imgcdn.yzwb.net/@/catchimages/20260317/1773731691252026937.jpg?imageMogr2/thumbnail/100x>/strip/ignore-error/1|imageslim' },
            { pos:12, name:'连云港队', p:4, w:0, d:2, l:2, gf:3, ga:6, gd:-3, pts:2,
              crest:'https://imgcdn.yzwb.net/@/catchimages/20260317/1773731689270001686.jpg?imageMogr2/thumbnail/100x>/strip/ignore-error/1|imageslim' },
            { pos:13, name:'镇江队', p:4, w:0, d:0, l:4, gf:2, ga:8, gd:-6, pts:0,
              crest:'https://imgcdn.yzwb.net/@/catchimages/20260317/1773731690860009466.jpg?imageMogr2/thumbnail/100x>/strip/ignore-error/1|imageslim' }
        ];
        function crestImg(url) {
            return `<img src="${url}" width="28" height="28" style="border-radius:50%;display:block;object-fit:cover" alt="" loading="lazy" onerror="this.style.display='none'">`;
        }

        function cls(p) {
            if(p===1)return'c1';if(p===2)return'c2';if(p===3)return'c3';if(p===13)return'cl';return'';
        }

        function renderSPFL() {
            // 积分榜
            document.getElementById('spflTable').innerHTML=`
            <tr><th></th><th></th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>进球</th><th>净胜</th><th>分</th></tr>
            ${SPFL.map(t=>`<tr>
                <td><span class="pos ${cls(t.pos)}">${t.pos}</span></td>
                <td><span class="crest">${crestImg(t.crest)}</span></td>
                <td class="team-name">${t.name}</td>
                <td class="stats">${t.p}</td><td class="stats">${t.w}</td><td class="stats">${t.d}</td><td class="stats">${t.l}</td>
                <td class="stats">${t.gf}-${t.ga}</td>
                <td class="stats gd ${t.gd>0?'positive':'negative'}">${t.gd>0?'+':''}${t.gd}</td>
                <td class="pts">${t.pts}</td>
            </tr>`).join('')}`;

            // 赛程预告 - 第9轮（带队徽）
            const crestMap = {};
            SPFL.forEach(t => { crestMap[t.name] = t.crest; });
            const fixRow = (home, away) => `
                <div class="match-card">
                    <div class="match-header"><span>6月13日 · 第9轮</span><span class="match-status upcoming">19:40</span></div>
                    <div class="match-teams">
                        <div class="match-team home"><span class="crest">${crestImg(crestMap[home])}</span><span class="match-name">${home}</span></div>
                        <div class="match-score vs">VS</div>
                        <div class="match-team away"><span class="crest">${crestImg(crestMap[away])}</span><span class="match-name">${away}</span></div>
                    </div>
                </div>`;

            const fixturesHTML = `
            <div style="margin-top:8px;">
                ${fixRow('徐州队','无锡队')}
                ${fixRow('宿迁队','镇江队')}
                ${fixRow('南通队','泰州队')}
            </div>`;
            document.getElementById('spflFixtures').innerHTML = fixturesHTML;
        }

        function showSection(s) {
            document.querySelectorAll('.section-tab').forEach(t=>t.classList.remove('active'));
            document.getElementById('worldcup-section').style.display=s==='worldcup'?'block':'none';
            document.getElementById('spfl-section').style.display=s==='spfl'?'block':'none';
            document.querySelectorAll('.section-tab')[s==='worldcup'?0:1].classList.add('active');
            document.body.classList.toggle('spfl-mode', s==='spfl');
        }

        loadWorldCup(); renderSPFL();
    </script>
</body>
</html>
