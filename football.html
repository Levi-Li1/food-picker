<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026 足球赛况</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%231a1a2e' stroke='%23333' stroke-width='1'/><polygon points='16,5 20,8 18,13 14,13 12,8' fill='none' stroke='%23fff' stroke-width='1.5'/><circle cx='16' cy='16' r='1.5' fill='%23fff'/></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #007aff;
            --green: #30d158; --red: #ff453a; --orange: #ff9f0a;
            --text: #ffffff; --text2: rgba(255,255,255,0.75); --text3: rgba(255,255,255,0.50);
            --glass: rgba(255,255,255,0.12); --glass-hover: rgba(255,255,255,0.18);
            --glass-border: rgba(255,255,255,0.15); --glass-active: rgba(255,255,255,0.25);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', sans-serif;
            background: linear-gradient(180deg, #0a1628 0%, #162447 30%, #1a1a2e 60%, #0f3460 100%);
            min-height: 100vh; color: var(--text);
            -webkit-font-smoothing: antialiased; position: relative; overflow-x: hidden;
            transition: background 0.6s ease;
        }
        body.spfl-mode {
            background: linear-gradient(180deg, #3b0a0a 0%, #5c1010 30%, #4a0000 60%, #7a1515 100%);
        }
        body::before {
            content: ''; position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at 20% 20%, rgba(0,122,255,0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 60%, rgba(48,209,88,0.10) 0%, transparent 50%),
                        radial-gradient(ellipse at 40% 80%, rgba(255,159,10,0.08) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
            transition: background 0.6s ease;
        }
        body.spfl-mode::before {
            background: radial-gradient(ellipse at 20% 15%, rgba(255,40,30,0.38) 0%, transparent 50%),
                        radial-gradient(ellipse at 75% 70%, rgba(255,30,20,0.28) 0%, transparent 50%),
                        radial-gradient(ellipse at 40% 80%, rgba(255,160,20,0.18) 0%, transparent 50%);
        }
        /* 赛事氛围装饰 - 球场灯光效果 */
        body.spfl-mode::after {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.06) 0%, transparent 60%),
                radial-gradient(circle at 12% 50%, rgba(255,50,35,0.15) 0%, transparent 50%),
                radial-gradient(circle at 88% 55%, rgba(255,40,30,0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 90%, rgba(255,120,30,0.08) 0%, transparent 35%);
            pointer-events: none; z-index: 0;
            animation: fieldGlow 4s ease-in-out infinite alternate;
        }
        @keyframes fieldGlow {
            0% { opacity: 0.65; }
            100% { opacity: 1; }
        }
        .content { position: relative; z-index: 1; }
        /* 世界杯海报风格头部 */
        .header {
            text-align: center; padding: 60px 20px 30px;
            position: relative;
        }
        .header::before {
            content: '2026';
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            font-size: 120px; font-weight: 900; letter-spacing: 8px;
            color: rgba(255,255,255,0.03);
            pointer-events: none; z-index: -1;
            line-height: 1;
        }
        
        .header h1 {
            font-size: 34px; font-weight: 700; letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #a0c4ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            position: relative;
        }
        .header .sub {
            font-size: 13px; color: var(--text3); margin-top: 6px; letter-spacing: 2px;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .header .sub::before, .header .sub::after {
            content: ''; width: 40px; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }
        /* 折叠面板 */
        .date-group { margin-bottom: 12px; }
        .date-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; border-radius: 10px;
            background: rgba(255,255,255,0.08);
            cursor: pointer; font-size: 13px; font-weight: 600;
            color: var(--text2); user-select: none;
            transition: background 0.2s;
        }
        .date-header:hover { background: rgba(255,255,255,0.12); }
        .date-header .arrow {
            transition: transform 0.3s;
            width: 14px; height: 14px;
        }
        .date-header .arrow.open { transform: rotate(180deg); }
        .date-body { overflow: hidden; max-height: 0; transition: max-height 0.4s ease; }
        .date-body.open { max-height: 2000px; }
        .date-body .match-card { margin-top: 8px; }

        .section-tabs {
            display: flex; gap: 0; margin: 0 20px 16px;
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 14px; padding: 3px; border: 1px solid var(--glass-border);
        }
        .section-tab {
            flex: 1; padding: 11px 16px; text-align: center; font-size: 14px; font-weight: 600;
            border: none; border-radius: 11px; cursor: pointer; background: transparent;
            color: var(--text3); font-family: inherit; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .section-tab.active {
            background: var(--glass-active); color: #fff;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .card {
            background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 20px; margin: 12px 16px; padding: 22px 20px;
            border: 1px solid var(--glass-border); box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        .card h2 {
            font-size: 18px; font-weight: 600; margin-bottom: 16px;
            color: var(--text2); letter-spacing: -0.2px;
            display: flex; align-items: center; gap: 8px;
        }
        

        .match-card {
            background: rgba(255,255,255,0.06); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 14px; padding: 16px 18px; margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.08); transition: all 0.2s;
        }
        .match-card:hover { background: rgba(255,255,255,0.10); }
        .match-header {
            display: flex; justify-content: space-between; font-size: 12px;
            color: var(--text3); margin-bottom: 12px; letter-spacing: 0.3px;
        }
        .match-status {
            font-weight: 600; font-size: 10px; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.5px;
        }
        .match-status.live { background: var(--red); color: #fff; animation: pulse 2s infinite; }
        .match-status.live::before { content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:#fff; margin-right:5px; vertical-align:middle; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.7} }
        .match-status.final { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.45); }
        .match-status.upcoming { background: rgba(255,159,10,0.3); color: #ffb74d; }

        .match-teams {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
        }
        .match-team {
            display: flex; align-items: center; gap: 8px;
            font-size: 16px; font-weight: 600; letter-spacing: -0.2px;
            min-width: 0;
        }
        .match-team.home { justify-content: flex-start; }
        .match-team.away { justify-content: flex-end; flex-direction: row-reverse; }
        .match-team .flag { display: inline-flex; align-items: center; flex-shrink: 0; }
        .match-team .flag img { display: block; }
        .match-name {
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .match-score {
            font-size: 28px; font-weight: 700;
            text-align: center; letter-spacing: 4px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            min-width: 80px;
        }
        .match-score.vs { font-size: 14px; color: var(--text3); letter-spacing: 2px; font-weight: 500; }
        .match-scorers { font-size: 11px; color: var(--text3); margin-top: 8px; letter-spacing: 0.3px; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th {
            text-align: left; padding: 10px 4px 8px; font-size: 10px; color: var(--text3);
            text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.08); font-weight: 500;
        }
        th:first-child { width: 30px; }
        th:nth-child(2) { min-width: 100px; }
        th:last-child, td:last-child { text-align: right; }
        td { padding: 10px 4px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        tr:last-child td { border-bottom: none; }

        .pos {
            width: 22px; height: 22px; border-radius: 50%;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700;
        }
        .pos.c1 { background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; }
        .pos.c2 { background: linear-gradient(135deg, #C0C0C0, #A8A8A8); color: #000; }
        .pos.c3 { background: linear-gradient(135deg, #CD7F32, #B8860B); color: #fff; }
        .pos.cl { background: rgba(255,69,58,0.5); color: #fff; font-size: 10px; }
        .team-name { font-weight: 500; font-size: 13px; }
        .team-name .flag { font-size: 16px; margin-right: 4px; vertical-align: -1px; }
        .crest-inline { width: 28px; height: 28px; display: inline-block; vertical-align: middle; margin-right: 6px; }
        .crest-inline img { width: 28px; height: 28px; border-radius: 50%; display: block; }
        th:nth-child(2) { width: auto; }
        .stats { font-size: 11px; color: var(--text3); font-variant-numeric: tabular-nums; }
        .pts { font-weight: 700; font-size: 14px; color: #fff; }
        .gd { font-weight: 500; }
        .gd.positive { color: var(--green); }
        .gd.negative { color: var(--red); }

        .group-selector { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
        .group-btn {
            width: 34px; height: 34px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
            color: var(--text3); transition: all 0.25s;
        }
        .group-btn:hover { background: rgba(255,255,255,0.12); }
        .group-btn.active {
            background: rgba(0,122,255,0.3); border-color: rgba(0,122,255,0.4);
            color: #fff; box-shadow: 0 0 12px rgba(0,122,255,0.2);
        }

        .loading { text-align: center; padding: 36px; color: var(--text3); }
        .bottom-spacer { height: 40px; }
        .footer-version { text-align: center; font-size: 10px; color: rgba(255,255,255,0.2); padding-bottom: 24px; letter-spacing: 0.5px; }
        .note { font-size: 11px; color: var(--text3); margin-top: 16px; text-align: center; letter-spacing: 0.5px; }

        .summary-row {
            display: flex; justify-content: space-between; padding: 6px 0;
            font-size: 13px;
        }
        .summary-row .label { color: var(--text3); }
        .summary-row .value { font-weight: 600; }

        @media (max-width: 380px) {
            th:nth-child(4),td:nth-child(4),
            th:nth-child(5),td:nth-child(5),
            th:nth-child(6),td:nth-child(6) { display: none; }
        }
    </style>
</head>

        function flagImg(cc) {

        async function loadWorldCup() {
            // 嵌入数据已由底部 IIFE 秒开渲染
            // 后台静默刷新，最多尝试 15s
            const API = 'https://worldcup26.ir';
            try {
                const ctl = new AbortController();
                const t = setTimeout(() => ctl.abort(), 15000);
                const [gr, pr] = await Promise.all([
                    fetch(API+'/get/games', {signal: ctl.signal}),
                    fetch(API+'/get/groups', {signal: ctl.signal})
                ]);
                clearTimeout(t);
                const gd = await gr.json(), pd = await pr.json();
                const games = gd.games||gd||[];
                const teams = {...ZH}, stadiums = {...STADIUMS};
                renderWorldCupMatches(games, teams, stadiums);
                renderGroupStandings(pd, teams, games);
            } catch(e) {
                // 静默失败，嵌入数据已显示
            }
        }

        function renderWorldCupMatches(games, teams, stadiums) {
            const finished = games.filter(g => g.finished==='TRUE'||g.time_elapsed==='finished');

            // 合并今日+未来3天 → 赛程预告（按北京时间筛选）
            const now = new Date();
            const dateSet = new Set();
            for (let i=0; i<=3; i++) {
                const d = new Date(now);
                d.setDate(d.getDate()+i);
                dateSet.add(`${d.getMonth()+1}/${d.getDate()}`);
            }
            const upcoming = games.filter(g => {
                if(g.finished==='TRUE'||g.time_elapsed==='finished'||g.time_elapsed==='live') return false;
                const bj = toBeijing(g.local_date, g.stadium_id);
                return bj && dateSet.has(bj.split(' ')[0]);
            });

            // 最新赛果：只显示最近一个比赛日
            let recentFinished = [];
            if(finished.length) {
                const dates = [...new Set(finished.map(g => toBeijing(g.local_date, g.stadium_id).split(' ')[0]))].sort((a,b) => b.localeCompare(a));
                const latestDate = dates[0];
                recentFinished = finished.filter(g => toBeijing(g.local_date, g.stadium_id).startsWith(latestDate));
            }
            const rd=document.getElementById('wc-recent');
            rd.innerHTML = recentFinished.length
                ? '<h2>最新赛果</h2>'+recentFinished.map(g=>matchHTML(g,teams,'final',stadiums)).join('')
                : '<h2>最新赛果</h2><p style="color:var(--text3);text-align:center;padding:10px;">暂无已结束的比赛</p>';

            // 赛程预告按北京时间日期折叠
            const running=games.filter(g=>g.time_elapsed==='live');
            const all=[...running,...upcoming];
            const grouped = {};
            all.forEach(g => {
                const bj = toBeijing(g.local_date, g.stadium_id);
                const gd = bj ? bj.split(' ')[0] : '未知';
                if(!grouped[gd]) grouped[gd] = [];
                grouped[gd].push(g);
            });
            const todayDiv = document.getElementById('wc-today');
            if (all.length === 0) {
                todayDiv.innerHTML = '<h2>赛程预告</h2><p style="color:var(--text3);text-align:center;padding:10px;">暂无预告数据</p>';
            } else {
                let html = '<h2>赛程预告</h2>';
                const dates = Object.keys(grouped).sort();
                dates.forEach((date, idx) => {
                    const ms = grouped[date];
                    const f = idx === 0; // 第一个（最近）默认展开
                    html += `<div class="date-group">
                        <div class="date-header" onclick="toggleDate(this)">
                            <span>${date}（北京时间）· ${ms.length} 场比赛</span>
                            <svg class="arrow${f?' open':''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                        </div>
                        <div class="date-body${f?' open':''}">
                            ${ms.map(g => matchHTML(g, teams, g.time_elapsed==='live'?'live':'upcoming', stadiums)).join('')}
                        </div>
                    </div>`;
                });
                todayDiv.innerHTML = html;
            }
        }

        function toggleDate(el) {
            const body = el.nextElementSibling;
            const arrow = el.querySelector('.arrow');
            body.classList.toggle('open');
            arrow.classList.toggle('open');
        }

        // 球场时区偏移 (UTC) → 北京时间 +8
        const TZ = {1:-6,2:-6,3:-6,4:-5,5:-5,6:-5,7:-4,8:-4,9:-4,10:-4,11:-4,12:-4,13:-7,14:-7,15:-7,16:-7};
        const CITY = {1:'墨西哥城',2:'瓜达拉哈拉',3:'蒙特雷',4:'达拉斯',5:'休斯顿',6:'堪萨斯城',7:'亚特兰大',8:'迈阿密',9:'波士顿',10:'费城',11:'纽约',12:'多伦多',13:'温哥华',14:'西雅图',15:'旧金山',16:'洛杉矶'};
        function toBeijing(dateStr, stadiumId) {
            if(!dateStr) return '';
            const [d,t] = dateStr.split(' ');
            const [m,dy,y] = d.split('/');
            const [h,mi] = (t||'00:00').split(':');
            // 当地时间 → UTC（减去时区偏移）
            const utcMs = Date.UTC(+y, +m-1, +dy, +h - (TZ[stadiumId]||0), +mi);
            // UTC → 北京时间（+8小时）
            const bjMs = utcMs + 8 * 3600000;
            const bj = new Date(bjMs);
            return `${bj.getUTCMonth()+1}/${bj.getUTCDate()} ${String(bj.getUTCHours()).padStart(2,'0')}:${String(bj.getUTCMinutes()).padStart(2,'0')}`;
        }

        function matchHTML(g, teams, status, stadiums) {
            const hid = g.home_team_id, aid = g.away_team_id;
            const home = teams[hid]||g.home_team_name_en||'?';
            const away = teams[aid]||g.away_team_name_en||'?';
            const hflag = flagImg(FLAGS[hid]), aflag = flagImg(FLAGS[aid]);
            const bjTime = toBeijing(g.local_date, g.stadium_id);
            const labels = { live:'进行中', final:'已结束', upcoming:'即将开始' };
            const city = CITY[g.stadium_id]||'';
            const venue = stadiums?.[g.stadium_id]||'';

            const clean = (v) => {
                if(!v || v==='null' || v==='undefined') return '';
                // 处理 JSON 数组: ["a","b"]
                try {
                    const p = JSON.parse(v);
                    if(Array.isArray(p)) return p.filter(x=>x).join(', ');
                    if(typeof p === 'string') return p;
                    return '';
                } catch(e) {}
                // 处理 PostgreSQL 风格: {"a","b"}
                if(v.startsWith('{') && v.endsWith('}')) {
                    return v.slice(1,-1).split(',').map(s=>s.replace(/^"|"$/g,'').trim()).filter(x=>x).join(', ');
                }
                return String(v);
            };
            let scorers='';
            if(status==='final'){
                const hs = clean(g.home_scorers), as = clean(g.away_scorers);
                if(hs || as) scorers = `<div class="match-scorers"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-linejoin="round" style="vertical-align:-2px"><circle cx="12" cy="12" r="10"/><polygon points="12,5 14,9 18,10 15,13 16,18 12,15 8,18 9,13 6,10 10,9"/></svg> ${hs}${hs&&as?'  ·  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-linejoin="round" style="vertical-align:-2px"><circle cx="12" cy="12" r="10"/><polygon points="12,5 14,9 18,10 15,13 16,18 12,15 8,18 9,13 6,10 10,9"/></svg> ':''}${as}</div>`;
            }

            return `<div class="match-card">
                <div class="match-header"><span>${g.group||''}组 · ${bjTime}（北京时间）</span><span class="match-status ${status}">${labels[status]}</span></div>
                <div class="match-teams">
                    <div class="match-team home"><span class="flag">${hflag}</span><span class="match-name">${home}</span></div>
                    <div class="match-score ${status==='upcoming'?'vs':''}">${status==='upcoming'?'VS':`${g.home_score||0} – ${g.away_score||0}`}</div>
                    <div class="match-team away"><span class="flag">${aflag}</span><span class="match-name">${away}</span></div>
                </div>${scorers}${(city||venue)?`<div style="font-size:11px;color:var(--text3);margin-top:8px;display:flex;align-items:center;gap:4px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${city}${venue?' · ':''}${venue}</div>`:''}</div>`;
        }

        let currentGroup='A', allGroups=[], teamMap={};

        function renderGroupStandings(groupsData, teams, games) {
            teamMap=teams;
            allGroups=(groupsData.groups||groupsData).map(g=>({name:g.name||g.n||g.group,teams:g.teams||g.t||g.standings})).filter(g=>g.name);

            // 默认展开最新比赛所在小组
            const active = games.filter(g => g.time_elapsed==='live' || g.finished==='TRUE');
            if(active.length) {
                const latest = active.sort((a,b) => {
                    const da = a.local_date||'', db = b.local_date||'';
                    return db.localeCompare(da);
                })[0];
                if(latest.group) currentGroup = latest.group;
            }

            document.getElementById('groupBtns').innerHTML='ABCDEFGHIJKL'.split('').map(l=>
                `<button class="group-btn${l===currentGroup?' active':''}" onclick="showGroup('${l}')">${l}</button>`
            ).join('');
            showGroup(currentGroup);
        }

        function showGroup(letter) {
            currentGroup=letter;
            document.querySelectorAll('.group-btn').forEach(b=>b.classList.remove('active'));
            const btn = document.querySelector(`.group-btn[onclick*="'${letter}'"]`);
            if(btn) btn.classList.add('active');
            const g=allGroups.find(g=>g.name===letter);
            if(!g){document.getElementById('groupTable').innerHTML='<p style="color:var(--text3);text-align:center;">暂无数据</p>';return;}
            const list=(g.teams||g.standings||[]).sort((a,b)=>{
                const pa=(+(a.wins||a.won||a.w||0))*3+(+(a.draws||a.drawn||a.d||0));
                const pb=(+(b.wins||b.won||b.w||0))*3+(+(b.draws||b.drawn||b.d||0));
                if(pb!==pa)return pb-pa;
                return(+((b.gf||b.goals_for||0))-(+(b.ga||b.goals_against||0)))-(+((a.gf||a.goals_for||0))-(+(a.ga||a.goals_against||0)));
            });
            document.getElementById('groupTable').innerHTML=`<table>
                <tr><th></th><th>球队</th><th>赛</th><th>胜</th><th>平</th><th>负</th><th>进球</th><th>净胜</th><th>分</th></tr>
                ${list.map((t,i)=>{
                    const tid=t.team_id||t.id;
                    const n=ZH[tid]||teamMap[tid]||`Team ${tid}`;
                    const fl=flagImg(FLAGS[tid]);
                    const mp=+t.played||+t.mp||+t.p||0, w=+t.wins||+t.won||+t.w||0, d=+t.draws||+t.drawn||+t.d||0, l=+t.losses||+t.lost||+t.l||0;
                    const gf=+t.gf||+t.goals_for||0, ga=+t.ga||+t.goals_against||0, gd=gf-ga, pts=w*3+d;
                    return `<tr><td>${i+1}</td><td class="team-name"><span class="flag">${fl}</span>${n}</td><td class="stats">${mp}</td><td class="stats">${w}</td><td class="stats">${d}</td><td class="stats">${l}</td><td class="stats">${gf}-${ga}</td><td class="stats gd ${gd>0?'positive':gd<0?'negative':''}">${gd>0?'+':''}${gd}</td><td class="pts">${pts}</td></tr>`;
                }).join('')}
            </table>`;
        }

            document.getElementById('worldcup-section').style.display=s==='worldcup'?'block':'none';
            document.getElementById('spfl-section').style.display=s==='spfl'?'block':'none';
            document.querySelectorAll('.section-tab')[s==='worldcup'?0:1].classList.add('active');
            document.body.classList.toggle('spfl-mode', s==='spfl');
        }

        // ════════════════════════════════════════
        //  SPFL 客户端自动刷新
        // ════════════════════════════════════════
        async function loadSPFL() {
            const API = 'https://suchao.crazy-thursday.com';
            try {
                // 赛程：直接从官方 API 拉取最新数据
                const ctl = new AbortController();
                const t = setTimeout(() => ctl.abort(), 15000);
                const resp = await fetch(API+'/api/matches?page=1&perPage=100&all=true', {signal: ctl.signal});
                clearTimeout(t);
                const d = await resp.json();
                const items = d.items || d || [];
                renderSPFLFixtures(items);
            } catch(e) {
                // 静默失败，嵌入数据已显示
            }
        }

        // 渲染赛程预告（带队徽、场馆信息）
        function renderSPFLFixtures(matches) {
            // 只取未来比赛
            const now = new Date();
            const upcoming = matches.filter(m => {
                if(m.homeScore !== null || m.awayScore !== null) return false;
                try {
                    return new Date(m.date) >= new Date(now.getTime() - 86400000);
                } catch(e) { return true; }
            }).sort((a,b) => a.date.localeCompare(b.date) || (a.time||'').localeCompare(b.time||''));

            if(upcoming.length === 0) return;

            // 按日期分组
            const groups = {};
            upcoming.forEach(m => {
                if(!groups[m.date]) groups[m.date] = [];
                groups[m.date].push(m);
            });

            const dates = Object.keys(groups).sort().slice(0, 4); // 最多显示4个比赛日
            let html = '';
            dates.forEach(dt => {
                const ms = groups[dt];
                try {
                    const d = new Date(dt);
                    const label = (d.getMonth()+1)+'月'+d.getDate()+'日';
                    html += '<div style="margin-top:8px;"><div style="font-size:12px;color:var(--text3);margin-bottom:8px;padding-left:2px;">'+label+'</div>';
                    ms.forEach(m => {
                        const home = (m.homeTeam||'?')+'队';
                        const away = (m.awayTeam||'?')+'队';
                        const time = m.time||'19:40';
                        const venue = m.venue||'';
                        const hLogo = m.homeTeamLogo ? '<img src="'+m.homeTeamLogo+'" width="28" height="28" style="border-radius:50%;display:block;object-fit:cover" alt="" loading="lazy">' : '';
                        const aLogo = m.awayTeamLogo ? '<img src="'+m.awayTeamLogo+'" width="28" height="28" style="border-radius:50%;display:block;object-fit:cover" alt="" loading="lazy">' : '';
                        const vHtml = venue ? '<div style="font-size:11px;color:var(--text3);margin-top:8px;display:flex;align-items:center;gap:4px;"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'+venue+'</div>' : '';
                        html += '<div class="match-card">'+
                            '<div class="match-header"><span>'+label+' · '+time+'</span><span class="match-status upcoming">即将开始</span></div>'+
                            '<div class="match-teams">'+
                                '<div class="match-team home"><span class="crest-inline">'+hLogo+'</span><span class="match-name">'+home+'</span></div>'+
                                '<div class="match-score vs">VS</div>'+
                                '<div class="match-team away"><span class="crest-inline">'+aLogo+'</span><span class="match-name">'+away+'</span></div>'+
                            '</div>'+vHtml+'</div>';
                    });
                    html += '</div>';
                } catch(e) {}
            });

            if(html) {
                document.getElementById('spflFixtures').innerHTML = html;
            }
        }

        loadWorldCup(); renderSPFL(); loadSPFL();

        // 立即用嵌入数据渲染（不等待 loadWorldCup）
        (function(){if(typeof E_G!=='undefined'&&typeof E_P!=='undefined'){var t={},s={};for(var k in ZH)t[k]=ZH[k];for(var k in STADIUMS)s[k]=STADIUMS[k];
// 将缩写字段名映射为全名（兼容嵌入优化格式）
var games=E_G[0]&&E_G[0].i!==undefined?
  E_G.map(function(m){return{id:m.i,group:m.g,home_team_id:m.h,away_team_id:m.a,home_score:m.hs,away_score:m.as,home_scorers:m.hs2,away_scorers:m.as2,local_date:m.ld,stadium_id:m.s,finished:m.f,time_elapsed:m.te};}):
  E_G;
var groups=E_P[0]&&E_P[0].n!==undefined?
  E_P.map(function(g){return{name:g.n||g.name||g.group,teams:(g.t||g.teams||g.standings||[]).map(function(t){return{team_id:t.id,wins:t.w,draws:t.d,losses:t.l,played:t.p,goals_for:t.gf,goals_against:t.ga};})};}):
  E_P;
renderWorldCupMatches(games,t,s);renderGroupStandings({groups:groups},t,games);}})();
    </script>
</body>
</html>
