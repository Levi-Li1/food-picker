<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初二升初三 · 暑假60天逆袭计划 · 完整版</title>
<style>
:root{--blue:#007aff;--red:#ff3b30;--green:#34c759;--orange:#ff9500;--purple:#af52de;--teal:#5ac8fa;--pink:#ff2d55;--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--sub:#86868b}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.9;font-size:15px;padding:0}
.container{max-width:1000px;margin:0 auto;padding:0 16px}
h1{text-align:center;font-size:30px;padding:32px 0 4px;letter-spacing:-0.5px}
.subtitle{text-align:center;color:var(--sub);font-size:14px;margin-bottom:20px}

/* Navigation */
nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.95);backdrop-filter:blur(20px);border-bottom:1px solid #e5e5ea;padding:8px 0;margin-bottom:16px}
nav select{padding:8px 14px;border-radius:10px;border:1px solid #ccc;font-size:15px;margin:0 8px}
nav .title{font-weight:700;font-size:16px;vertical-align:middle}

/* Mind Map Section */
.mm-section{background:var(--card);border-radius:16px;padding:20px 24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.mm-section h2{font-size:22px;margin-bottom:4px}
.mm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:12px 0}
.mm-box{background:#f8f8fa;border-radius:12px;padding:14px;border-left:4px solid var(--blue)}
.mm-box h4{font-size:15px;margin-bottom:6px;color:var(--blue)}
.mm-box ul{margin-left:16px;font-size:13px}
.mm-box ul li{margin:2px 0;color:#444}
.mm-box .star{color:var(--red);font-size:12px}

/* Day Page */
.day-page{border:2px solid #e5e5ea;background:var(--card);border-radius:16px;margin-bottom:20px;overflow:hidden}
.day-page .dtop{background:linear-gradient(135deg,var(--blue),#5856d6);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.day-page .dtop .dnum{font-size:32px;font-weight:800}
.day-page .dtop .dinfo{text-align:right;font-size:13px;opacity:.9}
.day-page .dbody{padding:20px}
.day-page .goal{background:#fffbf0;border:1px solid #ffd54f;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:14px}
.day-page .goal b{color:#e65100}

/* Step blocks */
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.step{background:#f8f8fa;border-radius:12px;padding:14px 16px}
.step.full{grid-column:1/-1}
.step h4{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.step .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}
.step p,.step ul li{font-size:14px;color:#444;margin:4px 0}
.step ul{padding-left:18px}

/* Practice questions */
.q-block{background:#fff;border:1px solid #e5e5ea;border-radius:10px;padding:12px 16px;margin:8px 0}
.q-block .q-num{font-weight:700;color:var(--blue);margin-right:6px}
.q-block .question{font-size:14px;margin:4px 0}
.ans-btn{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:14px;border:1px solid var(--blue);color:var(--blue);background:transparent;font-size:12px;cursor:pointer;transition:.2s}
.ans-btn:hover{background:var(--blue);color:#fff}
.answer{display:none;background:#f0f7ff;padding:10px 14px;border-radius:8px;margin-top:8px;font-size:13px;border-left:3px solid var(--blue)}
.answer.show{display:block}

/* Tips and checks */
.tip{background:#f0f7ff;border-left:3px solid var(--blue);padding:10px 14px;margin:10px 0;font-size:13px;border-radius:0 8px 8px 0}
.tip b{color:var(--blue)}
.err-box{background:#fff5f5;border-left:3px solid var(--red);padding:10px 14px;margin:10px 0;font-size:13px;border-radius:0 8px 8px 0}
.err-box b{color:var(--red)}
.check{background:#e8f5e9;border:1px solid #a5d6a7;border-radius:10px;padding:10px 14px;margin:10px 0;font-size:13px}
.check b{color:#2e7d32}

/* Formula box */
.formula{background:#fffbf0;border:1px solid #ffcc80;border-radius:10px;padding:12px 16px;margin:8px 0;font-size:14px;text-align:center}
.formula .eq{font-size:18px;font-weight:700;color:#e65100;letter-spacing:1px;padding:4px 0}
.formula .meaning{font-size:12px;color:#888;margin-top:4px}

/* Mind Map Tabs */
.mm-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.mm-tab{padding:8px 16px;border-radius:18px;font-size:13px;font-weight:600;border:none;cursor:pointer;background:#e5e5ea;color:#666;transition:.2s}
.mm-tab.active{background:var(--blue);color:#fff}
.mm-panel{display:none}
.mm-panel.active{display:block}

/* Print */
@media print{
 body{font-size:11px;background:#fff}
 .day-page{break-inside:avoid;border:1px solid #ccc;box-shadow:none}
 .dtop{background:#333;color:#fff}
 nav{display:none}
 .answer{display:block!important}
 .ans-btn{display:none}
}

/* Summary table */
.summ-table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.summ-table th,.summ-table td{padding:6px 8px;border:1px solid #e5e5ea;text-align:center}
.summ-table th{background:#f8f8fa;font-weight:600}

/* Weekly marker */
.week-marker{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;text-align:center;padding:16px;border-radius:14px;font-size:20px;font-weight:700;margin:32px 0 20px}
.week-marker .wnote{font-size:13px;opacity:.85;margin-top:4px}

.special-card{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;border-radius:16px;padding:24px;margin-bottom:20px}
.special-card h2,.special-card td{color:#fff}
.special-card b{color:#ffcc80}
.footer{text-align:center;color:var(--sub);font-size:12px;padding:30px}
</style>
</head>
<body>

<a href="index.html" style="font-size:12px;color:var(--sub);text-decoration:none;margin-left:auto">📋 总览</a>
</div>
</nav>

<script>
function showMM(subj) {
  document.querySelectorAll('.mm-tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.mm-panel').forEach(p=>p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('mm-'+subj).classList.add('active');
}
function showAns(btn) {
  const ans = btn.nextElementSibling;
  ans.classList.toggle('show');
  btn.textContent = ans.classList.contains('show') ? '隐藏答案' : '点击查看答案';
}
function speak(text) {
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.75;
    window.speechSynthesis.speak(u);
  }
}
</script>
